<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Aitockの記録を書き出す</title><style>body{max-width:620px;margin:60px auto;padding:24px;font:16px/1.9 system-ui,sans-serif;color:#1b3028;background:#f7f9f6}main{background:white;padding:28px;border-radius:22px}h1{font-size:27px}button{background:#0d5747;color:white;border:0;border-radius:12px;padding:14px 24px;font:inherit;cursor:pointer}small{display:block;color:#61736c;margin-top:20px}#status{white-space:pre-wrap}</style></head><body><main><h1>Aitockの記録を、AIstockへ。</h1><p>このブラウザーに保存した「自分の記録」を、JSONファイルに書き出します。元の記録は消えません。</p><button id="export" type="button">自分の記録を書き出す</button><p id="status" role="status"></p><small>このページは、以前のAitockと同じドメインに設置して使います。新しいサイトや、ファイルを直接開いた画面からは、以前の記録にアクセスできません。書き出したファイルには自分の文章が入るので、大切に保管してください。</small></main><script>
'use strict';
document.getElementById('export').addEventListener('click',()=>{
 const status=document.getElementById('status');
 if(!['aitock.vercel.app','localhost','127.0.0.1'].includes(location.hostname)){status.textContent='以前のAitockと同じURLで開いてください。ここではデータを読み込みません。';return;}
 try{
  const raw=localStorage.getItem('aitock:local-journal:v1');
  if(raw===null){status.textContent='このブラウザーには記録がありません。以前使った端末・ブラウザー・URLを確認してください。';return;}
  const data=JSON.parse(raw);
  if(data?.version!==1||!Array.isArray(data.records)||data.records.length>100){status.textContent='形式を確認できません。元の記録は変更していません。運営にご相談ください。';return;}
  const blob=new Blob([raw],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='aitock-learning-records-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);
  status.textContent=data.records.length+'件を書き出しました。AIstockの「自分用ノート」にある引き継ぎ欄で、このファイルを選んでください。';
 }catch{status.textContent='記録を読み取れませんでした。ブラウザーの保存設定をご確認ください。元のデータは変更していません。';}
});
</script></body></html>
